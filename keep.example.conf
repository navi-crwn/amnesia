# ============================================
# CONTOH KEEP LIST AMNESIA — yang TIDAK dihapus saat logout/login.
# Salin jadi keep.conf (build.sh melakukannya otomatis), lalu sesuaikan.
# keep.conf milikmu tidak ikut ke GitHub.
# Satu baris = satu path relatif dari home (~), boleh pakai * (glob).
# Baris "keychain:<nama>" = item Keychain yang tidak dihapus.
# Folder ~/Keep dan ~/.amnesia selalu aman.
# ============================================

# --- VPN versi .dmg (contoh: NordVPN & Surfshark) ---
Library/Application Support/com.nordvpn*
Library/Application Support/com.surfshark*
Library/Containers/*nordvpn*
Library/Containers/*surfshark*
Library/Group Containers/*nordvpn*
Library/Group Containers/*surfshark*
Library/Preferences/com.nordvpn*
Library/Preferences/*surfshark*
keychain:com.nordvpn.*
keychain:com.surfshark.*
keychain:*.XAUTH

# --- Kunci "Safe Storage" (profil di Profile Vault tetap bisa dibuka) ---
keychain:* Safe Storage

# --- Login CLI yang tersimpan di Keychain (filenya ada di Profile Vault) ---
keychain:Claude Code*
keychain:gh:*
keychain:gemini

# --- Kunci SSH ---
.ssh

# --- Program & setting Terminal ---
.homebrew
.local/bin
.opencode
.zshrc
.zprofile
.gitconfig

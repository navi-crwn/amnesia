# ============================================
# AMNESIA KEEP LIST EXAMPLE: things that are NOT wiped at logout/login.
# build.sh copies this to keep.conf the first time. Edit keep.conf to your taste.
# Your keep.conf never goes to GitHub.
# One line = one path from your home folder (~). * works as a wildcard.
# A "keychain:<name>" line keeps that Keychain item.
# Your Keep folder (Settings, ~/Keep by default) and ~/.amnesia are always safe.
# ============================================

# --- VPN apps from a .dmg (e.g. NordVPN & Surfshark) ---
Library/Application Support/com.nordvpn*
Library/Application Support/com.surfshark*
Library/Containers/*nordvpn*
Library/Containers/*surfshark*
Library/Group Containers/*nordvpn*
Library/Group Containers/*surfshark*
Library/Preferences/com.nordvpn*
Library/Preferences/*surfshark*
keychain:com.nordvpn.*
keychain:com.surfshark.*
keychain:*.XAUTH

# --- "Safe Storage" keys (so Profile Vault snapshots can still be opened) ---
keychain:* Safe Storage

# --- CLI logins stored in the Keychain (their files live in the Profile Vault) ---
keychain:Claude Code*
keychain:gh:*
keychain:gemini

# --- Amnesia Backup: scheduled backup password & cloud login (rclone) ---
keychain:Amnesia Backup
.config/rclone

# --- SSH keys ---
.ssh

# --- Terminal tools & settings ---
.homebrew
.local/bin
.opencode
.zshrc
.zprofile
.gitconfig

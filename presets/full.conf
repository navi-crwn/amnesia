## Amnesia mode preset: Retrograde Amnesia. Like a brand-new account at every login.
## Only the Keep folder, ~/.amnesia and these lines survive. Amnesia needs them to work, so they can't be removed
## by an AI suggestion (REQUIRED lines).
## Lines starting with "##" are notes for this file only. Every other line is copied into keep.conf.
# --- Amnesia itself: backup password, cloud login for backups (rclone), VirusTotal key ---
keychain:Amnesia Backup
keychain:Amnesia VirusTotal
.config/rclone
# --- "Safe Storage" keys, so vault snapshots you restore by hand can still be opened ---
keychain:* Safe Storage

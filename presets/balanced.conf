## Amnesia mode preset: Selective Amnesia (recommended). The basic list for a new install: only what almost everyone needs.
## Lines starting with "##" are notes for this file only. Every other line is copied into keep.conf,
## between "# amnesia-mode: balanced begin" and "# amnesia-mode end".
## It must stay equal to keep.example.conf (test_clean.sh checks it).
# --- Amnesia: scheduled backup password, cloud login (rclone), VirusTotal key for releases ---
keychain:Amnesia Backup
keychain:Amnesia VirusTotal
.config/rclone

# --- "Safe Storage" keys (so Profile Vault snapshots can still be opened) ---
keychain:* Safe Storage

# --- SSH keys and your Git name and email ---
.ssh
.gitconfig

# --- Your shell settings ---
.zshrc
.zprofile

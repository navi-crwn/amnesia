## Amnesia mode preset: Partial Amnesia. Apps keep their settings and logins in place.
## Your files, Downloads, Desktop, caches, logs, recent lists, the Trash and shell history are still wiped.
## Honest note: browsing history and cookies inside a browser's own folder stay too, because that folder is kept.
## Lines starting with "##" are notes for this file only. Every other line is copied into keep.conf.
# --- Amnesia itself: backup password, cloud login for backups (rclone), VirusTotal key, "Safe Storage" keys ---
## Listed on their own (the wider lines below cover them too), so stopping to keep a wider line never drops them.
keychain:Amnesia Backup
keychain:Amnesia VirusTotal
.config/rclone
keychain:* Safe Storage
# --- App data, settings and logins ---
Library/Application Support/*
Library/Containers/*
Library/Group Containers/*
Library/Preferences/*
# --- Web logins (Safari and apps that use the system browser engine) ---
Library/Cookies
Library/HTTPStorages
Library/WebKit
Library/Safari
# --- All Keychain items (passwords and logins) ---
keychain:*
# --- Terminal tools, shells and their settings ---
.config
.local
.ssh
.gitconfig
.zshrc
.zprofile
.zshenv

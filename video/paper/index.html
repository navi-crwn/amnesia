<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Amnesia Paper</title>
<!-- Video Amnesia gaya paper craft stop motion. Semua gambar dibuat dengan kode (HTML/SVG/CSS) dan
     dianimasikan dengan GSAP, lalu "dipatah-patah" jadi 12 gambar per detik seperti stop motion asli.
     URL (atau #hash):  ?cut=30|15|p30|b30|all  &ar=h|v  &play  &t=12.5  &nocap  &raw
     Naskah + urutan adegan: ../script.js (disalin ke sini oleh build.js). Efek suara + musik: sound.js. -->
<style>
@font-face{font-family:"Fraunces";src:url("assets/fraunces.woff2") format("woff2");font-weight:100 900;font-display:block}
@font-face{font-family:"Caveat";src:url("assets/caveat.woff2") format("woff2");font-weight:400 700;font-display:block}
@font-face{font-family:"Nunito";src:url("assets/nunito.woff2") format("woff2");font-weight:200 1000;font-display:block}
:root{
  --ink:#2a2733;--ink-2:#4a4552;--cream:#f6eedd;--paper:#fbf7ee;--kraft:#c79b6c;--kraft-d:#a77a4f;
  --indigo:#5b5bd6;--indigo-d:#3d3ca8;--cyan:#3fb6c6;--pink:#e2729c;--green:#58b07e;--green-d:#3e8a5f;
  --mustard:#e9b949;--tomato:#e0614b;--sky:#9fd0e6;--navy:#1d2342;--navy-2:#2a3160;
  --serif:"Fraunces",Georgia,serif;--hand:"Caveat","Comic Sans MS",cursive;--ui:"Nunito",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:#111;overflow:hidden;width:100%;height:100%}
#root{position:relative;width:100%;height:100%;overflow:hidden;background:#1b1712}
#stage{position:absolute;left:0;top:0;overflow:hidden;background:#1b1712;transform-origin:0 0;font-family:var(--ui);color:var(--ink)}
#stage.h{width:1920px;height:1080px}#stage.v{width:1080px;height:1920px}
#cam{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
#world{position:absolute;inset:0;transform-origin:960px 560px}
.layer{position:absolute;left:0;top:0;width:1920px;height:1080px;visibility:hidden}
/* papan belakang (dinding) dan meja; dibuat lebih tinggi supaya versi tegak (9:16) tetap penuh */
.wall{position:absolute;left:-400px;right:-400px;top:-1000px;height:1760px}
.floor{position:absolute;left:-400px;right:-400px;top:740px;height:1300px}
.floor:before{content:'';position:absolute;left:0;right:0;top:0;height:26px;background:rgba(0,0,0,.16)}
/* potongan kertas: tekstur serat + tepi gunting tidak rata + bayangan */
.pc{position:absolute;filter:url(#tex) drop-shadow(5px 8px 5px rgba(38,22,8,.34))}
.pcs{position:absolute;filter:url(#texs) drop-shadow(3px 5px 3px rgba(38,22,8,.28))}
.flat{position:absolute;background-blend-mode:multiply,multiply,normal}
.pc>svg,.pcs>svg,.flat>svg{display:block;width:100%;height:100%;overflow:visible}
.rig{position:absolute}
.lift{filter:url(#tex) drop-shadow(14px 22px 12px rgba(38,22,8,.3))}
/* layar laptop */
.scr{position:absolute;overflow:hidden;background:#eef3f6;border-radius:6px}
.scr .st{position:absolute;inset:0;opacity:0}
.mbar{position:absolute;left:0;right:0;top:0;height:30px;background:rgba(255,255,255,.75);display:flex;align-items:center;gap:16px;padding:0 14px;font:800 15px var(--ui);color:#3d3a45}
.mbar .am{margin-left:auto;width:22px;height:22px;border-radius:7px;background:var(--indigo);display:flex;align-items:center;justify-content:center}
.mbar .am:after{content:'';width:9px;height:9px;border-radius:50%;border:2.5px solid #fff}
.wallp{position:absolute;inset:0}
.av{width:104px;height:104px;border-radius:50%;background:#d9cbe8;border:5px solid #fff;position:relative;overflow:hidden}
.av:before{content:'';position:absolute;left:31px;top:20px;width:42px;height:42px;border-radius:50%;background:#8a7aa6}
.av:after{content:'';position:absolute;left:14px;top:66px;width:76px;height:60px;border-radius:40px 40px 0 0;background:#8a7aa6}
.fld{width:270px;height:50px;border-radius:25px;background:rgba(255,255,255,.85);border:3px solid #fff;display:flex;align-items:center;justify-content:center;gap:12px;position:relative}
.fld i{width:14px;height:14px;border-radius:50%;background:#3d3a45;opacity:0;display:block}
.ok{position:absolute;right:-58px;top:4px;width:42px;height:42px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;opacity:0}
.ok:after{content:'';width:16px;height:9px;border-left:5px solid #fff;border-bottom:5px solid #fff;transform:translateY(-3px) rotate(-45deg)}
.nm{font:900 22px var(--ui);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.15)}
.dock{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);height:62px;padding:8px 12px;border-radius:18px;background:rgba(255,255,255,.55);display:flex;gap:10px}
.dock b{width:46px;height:46px;border-radius:12px;display:block}
.dic{position:absolute;width:118px;display:flex;flex-direction:column;align-items:center;gap:6px;font:800 15px var(--ui);color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.dic>div{width:84px;height:70px;border-radius:12px;position:relative}
.menu{position:absolute;right:10px;top:34px;width:300px;padding:10px;border-radius:14px;background:#fff;box-shadow:0 8px 0 rgba(0,0,0,.08);font:800 19px var(--ui);color:#3d3a45;opacity:0;transform-origin:85% 0}
.menu div{padding:10px 12px;border-radius:9px;display:flex;align-items:center;gap:10px}
.menu .on{color:var(--green-d)}.menu .on:before{content:'';width:12px;height:12px;border-radius:50%;background:var(--green)}
.menu hr{border:0;border-top:2px dashed #e4dccd;margin:6px 4px}
.menu .hi{background:var(--indigo);color:#fff}
.vmod{position:absolute;left:50%;top:50%;width:380px;margin:-130px 0 0 -190px;padding:22px;border-radius:20px;background:#fff;text-align:center;opacity:0}
.vmod b{display:block;font:900 26px var(--ui);margin:6px 0 14px}
.vmod .fld{margin:0 auto;width:300px;background:#f1ecf9;border-color:#e3dbf3}
.vmod .er{margin-top:12px;font:900 18px var(--ui);color:var(--tomato);opacity:0}
.stamp{position:absolute;padding:8px 22px;border:7px solid var(--tomato);border-radius:12px;color:var(--tomato);font:900 46px var(--ui);letter-spacing:.04em;text-transform:uppercase;opacity:0;white-space:nowrap;mix-blend-mode:multiply}
/* teks: huruf potongan kertas + label tulisan tangan */
.tiles{position:absolute;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px 4px}
.tile{position:relative;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:800;line-height:1;padding:.12em .14em .16em;border-radius:.08em;color:var(--ink)}
.tile.sp{width:.38em;padding:0}
.hand{font-family:var(--hand);font-weight:700}
.bub{position:absolute;padding:20px 30px 24px;font:700 46px var(--hand);color:var(--ink);white-space:nowrap}
.bub svg{position:absolute;inset:-6px;width:calc(100% + 12px);height:calc(100% + 40px);overflow:visible;z-index:-1}
.lbl{position:absolute;padding:4px 16px 6px;font:700 34px var(--hand);color:var(--ink);background:var(--paper);white-space:nowrap}
/* lapisan atas */
#hud{position:absolute;inset:0;pointer-events:none}
.cap{position:absolute;left:0;right:0;display:flex;justify-content:center}
.cap>div{position:absolute;opacity:0;padding:10px 34px 14px;font:700 50px/1.12 var(--hand);color:var(--ink);text-align:center;max-width:1500px}
.cap>div:before{content:'';position:absolute;inset:0;background:var(--paper);clip-path:polygon(0 6%,3% 0,22% 5%,47% 0,71% 4%,100% 0,98% 52%,100% 100%,74% 95%,50% 100%,26% 94%,0 100%,2% 48%);z-index:-1;filter:drop-shadow(3px 5px 3px rgba(0,0,0,.3))}
.nocap .cap{display:none}
#wipe{position:absolute;left:0;top:0;width:3200px;height:3400px;transform-origin:0 0;visibility:hidden}
#flick{position:absolute;inset:0;background:#fff3dc;opacity:0}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse 75% 70% at 45% 40%,transparent 55%,rgba(20,10,0,.42) 100%)}
#warm{position:absolute;inset:0;background:linear-gradient(125deg,rgba(255,220,160,.07),transparent 45%,rgba(30,15,50,.08))}
</style>
</head>
<body>
<div id="root">
<div id="stage" class="h">
  <div id="cam"><div id="world"></div></div>
  <div id="warm"></div>
  <div id="hud"><div class="cap" id="cap"></div></div>
  <div id="wipe"></div>
  <div id="flick"></div>
  <div id="vig"></div>
</div>
</div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <!-- kertas: tepi digunting tidak rata + serat diterangi dari kiri atas -->
    <filter id="tex" x="-6%" y="-6%" width="112%" height="112%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="1" seed="4" result="e"/>
      <feDisplacementMap in="SourceGraphic" in2="e" scale="6" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feImage class="grain" x="0" y="0" width="384" height="384" preserveAspectRatio="none" result="g0"/>
      <feTile in="g0" result="g"/>
      <feComposite in="d" in2="g" operator="arithmetic" k1="1.02" k2="0" k3="0" k4="0" result="m"/>
      <feComposite in="m" in2="d" operator="in"/>
    </filter>
    <!-- kertas tanpa tepi bergerigi (untuk layar dan teks kecil) -->
    <filter id="texs" x="-4%" y="-4%" width="108%" height="108%" color-interpolation-filters="sRGB">
      <feImage class="grain" x="0" y="0" width="384" height="384" preserveAspectRatio="none" result="g0"/>
      <feTile in="g0" result="g"/>
      <feComposite in="SourceGraphic" in2="g" operator="arithmetic" k1="1.02" k2="0" k3="0" k4="0" result="m"/>
      <feComposite in="m" in2="SourceGraphic" operator="in"/>
    </filter>
    <!-- lapisan kertas di dalam satu gambar: bayangan kecil -->
    <filter id="lay" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="2" dy="3" stdDeviation="1.6" flood-color="#2a1606" flood-opacity=".32"/></filter>
  </defs>
</svg>
<script src="assets/gsap.min.js"></script>
<script src="script.js"></script>
<script src="sound.js"></script>
<script>
(() => {
// ---------- pengaturan ----------
const HF = window.HF_CONFIG;
const Q = new URLSearchParams(HF ? HF.q : (location.search || location.hash.slice(1)));
const CUT = Q.get('cut') || '30', V = Q.get('ar') === 'v', S = window.SCRIPT;
const cut = S.cuts[CUT] || S.cuts['30'];
const STEP = 12;                                   // stop motion: 12 gambar per detik
const SW = V ? 1080 : 1920, SH = V ? 1920 : 1080;
const $ = s => document.querySelector(s), stage = $('#stage'), world = $('#world'), cam = $('#cam');
stage.className = V ? 'v' : 'h';
if (Q.has('nocap')) stage.classList.add('nocap');
function fit() { if (Q.has('raw') || HF) return; const k = Math.min(innerWidth / SW, innerHeight / SH); stage.style.transform = `scale(${k})`; stage.style.left = (innerWidth - SW * k) / 2 + 'px'; stage.style.top = (innerHeight - SH * k) / 2 + 'px'; }
addEventListener('resize', fit); fit();
// versi tegak: dunia 1920x1080 diperbesar sedikit dan dipotong kiri-kanan; ruang atas = judul, bawah = teks
const CK = V ? 1.12 : 1;
gsap.set(cam, { scale: CK, x: V ? 540 - 960 * CK : 0, y: V ? 900 - 560 * CK : 0 });
const CAP_Y = V ? 1500 : 968;
$('#cap').style.top = CAP_Y + 'px';

// angka acak yang selalu sama (setiap render harus menghasilkan gambar yang sama)
const hash = (a, b = 0) => { let h = (a * 374761393 + b * 668265263) | 0; h = (h ^ (h >>> 13)) * 1274126177 | 0; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647, rr = (a, b) => a + (b - a) * rnd();

// ---------- pembuat potongan kertas ----------
const el = (cls, css = {}, html = '', parent) => {
  const e = document.createElement('div'); e.className = cls; e.innerHTML = html;
  for (const [k, v] of Object.entries(css)) e.style[k] = typeof v === 'number' && !['opacity', 'zIndex'].includes(k) ? v + 'px' : v;
  if (parent) parent.appendChild(e); return e;
};
const svg = (vb, inner) => `<svg viewBox="${vb}">${inner}</svg>`;
// sobekan/potongan tidak rata untuk kotak
const cutRect = (w, h, j = 3, n = 7) => {
  const p = [], J = () => rr(-j, j);
  for (let i = 0; i < n; i++) p.push([w * i / n + J(), J()]);
  for (let i = 0; i < n; i++) p.push([w + J(), h * i / n + J()]);
  for (let i = n; i > 0; i--) p.push([w * i / n + J(), h + J()]);
  for (let i = n; i > 0; i--) p.push([J(), h * i / n + J()]);
  return 'M' + p.map(q => q[0].toFixed(1) + ' ' + q[1].toFixed(1)).join('L') + 'Z';
};
const card = (parent, x, y, w, h, fill, inner = '', cls = 'pc') =>
  el(cls, { left: x, top: y, width: w, height: h }, svg(`0 0 ${w} ${h}`, `<path d="${cutRect(w, h)}" fill="${fill}"/>${inner}`), parent);

// ---------- timeline + suara ----------
const tl = gsap.timeline({ paused: true });
const AUDIO = [], SFXQ = [], SILENCE = [];
const sfx = (id, at, gain = 1) => { if (window.SOUND && SOUND.sfx[id]) SFXQ.push({ id, at: +at.toFixed(2), gain }); };
const show = (L, t, d) => { if (t <= 0) gsap.set(L, { visibility: 'visible' }); else tl.set(L, { visibility: 'visible' }, t); tl.set(L, { visibility: 'hidden' }, t + d); };
// gerakan "pop" kertas: muncul dengan sedikit melenting
const popIn = (e, at, o = {}) => { gsap.set(e, { scale: 0, rotation: o.r0 ?? rr(-14, 14), transformOrigin: o.origin || '50% 80%' }); tl.to(e, { scale: o.s ?? 1, rotation: o.r ?? rr(-3, 3), duration: o.dur ?? .5, ease: 'back.out(2.2)' }, at); };
const slideIn = (e, at, dx, dy, dur = .7, ease = 'power3.out') => { gsap.set(e, { x: dx, y: dy }); tl.to(e, { x: 0, y: 0, duration: dur, ease }, at); };

// ---------- latar ----------
// serat kertas untuk dinding/meja: dibuat sekali di canvas (lebih ringan daripada filter SVG di bidang besar)
const GRAIN = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 384; const g = c.getContext('2d'), im = g.createImageData(384, 384);
  for (let i = 0; i < 384 * 384; i++) { const v = 232 + hash(i, 5) * 23 | 0; im.data[i * 4] = v; im.data[i * 4 + 1] = v - 2; im.data[i * 4 + 2] = v - 6; im.data[i * 4 + 3] = 255; }
  g.putImageData(im, 0, 0);
  g.globalAlpha = .07; g.strokeStyle = '#5a4630';
  for (let i = 0; i < 140; i++) { const x = hash(i, 11) * 384, y = hash(i, 12) * 384, a = hash(i, 13) * 6.3, l = 6 + hash(i, 14) * 22; g.lineWidth = .6 + hash(i, 15); g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + Math.cos(a) * l * .6 + 3, y + Math.sin(a) * l * .6, x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke(); }
  const u = c.toDataURL(); document.querySelectorAll('feImage.grain').forEach(f => f.setAttribute('href', u));
  return `url(${u})`;
})();
const paperBg = (color, light = true) => ({ backgroundColor: color, backgroundImage: `${GRAIN}${light ? ', radial-gradient(ellipse 60% 55% at 40% 35%, #ffffff, #d9d2c6)' : ''}` });
const SETS = {
  night: { wall: '#232a52', floor: '#5b4232' },
  day:   { wall: '#f2cf9e', floor: '#b98654' },
  home:  { wall: '#a9cdbd', floor: '#c48c58' },
  cream: { wall: '#efe1c6', floor: '#e5d2ae' },
  plum:  { wall: '#3a2f5c', floor: '#2c2447' },
};
function backdrop(L, kind, o = {}) {
  const s = SETS[kind];
  const w = el('wall flat', paperBg(s.wall), '', L);
  const f = el('floor flat', paperBg(s.floor, false), '', L);
  // garis serat kayu di meja
  let lines = ''; for (let i = 0; i < 26; i++) { const y = 30 + i * 46 + rr(-8, 8); lines += `<path d="M0 ${y} C 700 ${y + rr(-10, 10)}, 1600 ${y + rr(-14, 14)}, 2800 ${y + rr(-8, 8)}" stroke="rgba(0,0,0,.07)" stroke-width="${rr(2, 5).toFixed(1)}" fill="none"/>`; }
  f.innerHTML = svg('0 0 2720 1300', lines);
  if (kind === 'home') {   // pigura + tanaman
    if (o.frames !== false) card(L, 380, 170, 230, 170, '#f6eedd', `<rect x="16" y="16" width="198" height="138" fill="#e8b45a" filter="url(#lay)"/><path d="M16 154 L80 80 L130 120 L170 70 L214 154Z" fill="#5f9b74" filter="url(#lay)"/><circle cx="170" cy="48" r="16" fill="#fff6d8" filter="url(#lay)"/>`);
    if (o.frames !== false) card(L, 1340, 140, 180, 220, '#f6eedd', `<rect x="14" y="14" width="152" height="192" fill="#e88a9e" filter="url(#lay)"/><circle cx="90" cy="92" r="34" fill="#f6d1b0" filter="url(#lay)"/><path d="M40 206 Q90 120 140 206Z" fill="#7a6bb0" filter="url(#lay)"/>`);
    el('pc', { left: 1600, top: 470, width: 200, height: 290 }, svg('0 0 200 290', `
      <path d="M100 170 C 40 140, 20 70, 60 20 C 80 70, 95 110, 100 170Z" fill="#4f9a6a" filter="url(#lay)"/>
      <path d="M100 170 C 160 140, 190 60, 150 10 C 125 70, 110 110, 100 170Z" fill="#62b07b" filter="url(#lay)"/>
      <path d="M100 175 C 70 120, 85 60, 105 30 C 115 80, 112 130, 100 175Z" fill="#3e855a" filter="url(#lay)"/>
      <path d="M50 170 L150 170 L135 286 L65 286Z" fill="#d9775a" filter="url(#lay)"/><rect x="44" y="162" width="112" height="22" fill="#c9644a" filter="url(#lay)"/>`), L);
  }
  if (kind === 'day' || kind === 'night') {   // jendela
    const night = kind === 'night';
    const win = el('rig', { left: night ? 1290 : 1440, top: night ? 110 : 80, width: 430, height: 380 }, '', L);
    if (!night) gsap.set(win, { scale: .82, transformOrigin: '0 0' });
    card(win, 0, 0, 430, 380, night ? '#e9dcc0' : '#fbf3e2');
    const sky = card(win, 24, 24, 382, 332, night ? '#141a3a' : '#9fd3ea', '', 'pcs');
    let inner = night
      ? `<circle cx="290" cy="90" r="46" fill="#f7eecb"/><circle cx="270" cy="78" r="44" fill="#141a3a"/>` +
        Array.from({ length: 16 }, () => `<circle cx="${rr(10, 370).toFixed(0)}" cy="${rr(10, 190).toFixed(0)}" r="${rr(1.5, 3.5).toFixed(1)}" fill="#f7eecb"/>`).join('')
      : `<circle cx="300" cy="80" r="42" fill="#ffd56b"/><path d="M40 120 q30 -30 60 0 q20 -20 46 0 z" fill="#fff" opacity=".95"/>`;
    // gedung kota berlapis
    let city = ''; let x = -10;
    while (x < 382) { const w = rr(40, 80), h = rr(70, 190); city += `<rect x="${x.toFixed(0)}" y="${(332 - h).toFixed(0)}" width="${w.toFixed(0)}" height="${h.toFixed(0)}" fill="${night ? '#0b0f26' : '#7a95b8'}" filter="url(#lay)"/>`;
      for (let wy = 332 - h + 14; wy < 320; wy += 26) for (let wx = x + 10; wx < x + w - 14; wx += 20) if (hash(wx | 0, wy | 0) > (night ? .72 : .5)) city += `<rect x="${wx.toFixed(0)}" y="${wy.toFixed(0)}" width="9" height="12" fill="${night ? '#f2cf6b' : '#d7e6f3'}"/>`;
      x += w + rr(2, 8); }
    sky.insertAdjacentHTML('beforeend', `<svg viewBox="0 0 382 332" style="position:absolute;inset:0">${inner + city}</svg>`);
    card(win, 205, 18, 20, 344, night ? '#e9dcc0' : '#fbf3e2', '', 'pcs');
    card(win, 18, 180, 394, 18, night ? '#e9dcc0' : '#fbf3e2', '', 'pcs');
    if (night) {   // lampu meja + jam
      el('pc', { left: 150, top: 470, width: 220, height: 300 }, svg('0 0 220 300', `<path d="M40 286 L180 286 L170 300 L50 300Z" fill="#2d2a3a"/><rect x="104" y="110" width="12" height="180" fill="#3a3648" filter="url(#lay)"/><path d="M30 120 L110 20 L190 120Z" fill="#e0614b" filter="url(#lay)"/>`), L);
      el('', { position: 'absolute', left: 1180, top: 300, width: 900, height: 900, background: 'linear-gradient(200deg,rgba(220,230,255,.16),rgba(220,230,255,0) 70%)', clipPath: 'polygon(20% 0,62% 0,100% 100%,0 100%)', }, '', L);
      const clk = card(L, 360, 640, 210, 120, '#f6eedd', `<text x="105" y="84" text-anchor="middle" font-family="Nunito" font-weight="900" font-size="64" fill="#e0614b">02:14</text>`);
      return { clk };
    }
  }
  return {};
}

// ---------- laptop kertas ----------
// rig: tutup + layar + alas. Layar berisi lapisan tampilan: login, desktop penuh, desktop bersih, menu, vault.
function laptop(L, x, y, s = 1) {
  const r = el('rig', { left: x, top: y, width: 760, height: 520 }, '', L);
  gsap.set(r, { scale: s, transformOrigin: '50% 100%' });
  card(r, 0, 0, 760, 480, '#3b3f52');
  const scr = el('scr pcs', { left: 26, top: 24, width: 708, height: 432 }, '', r);
  el('pc', { left: -60, top: 474, width: 880, height: 46 }, svg('0 0 880 46', `<path d="M0 6 L880 6 L842 44 L38 44Z" fill="#a9afc0"/><path d="M0 0 L880 0 L880 10 L0 10Z" fill="#c7ccd8"/><rect x="380" y="10" width="120" height="8" rx="4" fill="#8d93a5"/>`), r);
  // lapisan layar

  const gh = el('pcs', { left: 960 - 290, top: 790, width: 580, height: 74, background: '#2a2733', color: '#fbf7ee', borderRadius: '37px', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '14px', font: '900 30px var(--ui)' },
    `<svg viewBox="0 0 24 24" style="width:34px;height:34px"><path fill="#fbf7ee" d="M12 .5a11.5 11.5 0 0 0-3.6 22.4c.6.1.8-.3.8-.6v-2c-3.2.7-3.9-1.5-3.9-1.5-.5-1.3-1.3-1.7-1.3-1.7-1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.7-1.6-2.6-.3-5.3-1.3-5.3-5.7 0-1.3.5-2.3 1.2-3.1-.1-.3-.5-1.5.1-3.1 0 0 1-.3 3.2 1.2a11 11 0 0 1 5.8 0c2.2-1.5 3.2-1.2 3.2-1.2.6 1.6.2 2.8.1 3.1.8.8 1.2 1.8 1.2 3.1 0 4.4-2.7 5.4-5.3 5.7.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6A11.5 11.5 0 0 0 12 .5z"/></svg>Free &amp; open source for macOS`, L);
  popIn(gh, t + 2.3); sfx('tap', t + 2.3, .6);
  sfx('ding', t + 1.2, .6);
  camera(t, d, { s: 1, x: 0, y: 0 }, { s: 1.04, x: 0, y: 0 });
}
SC.cta = (L, t, d) => cta(L, t, d, 'Forget everything. Pun intended.');
SC.cta2 = (L, t, d) => cta(L, t, d, 'Privacy. No headache.');
SC.cta3 = (L, t, d) => cta(L, t, d, 'Lend your Mac. Not your life.');

// ---------- susun versi ----------
const GROUP = id => ['agent', 'login', 'empty', 'duh', 'flash'].includes(id) ? 'spy' : ['parents', 'savelo', 'tovault', 'parentlogin', 'goodkid'].includes(id) ? 'parents' : ['borrow', 'busy', 'savevault', 'lend2', 'back'].includes(id) ? 'borrow' : 'cta';
const words = s => s.split(/\s+/).length / 2.3 + .2;
const capBox = $('#cap');
// lembar kertas penyapu untuk ganti skenario (satu lembar per transisi, warnanya sesuai skenario berikutnya)
function doWipe(at, color) {
  const w = el('pc', { left: 0, top: 0, width: 3200, height: 3400, visibility: 'hidden' }, '', stage);
  stage.insertBefore(w, $('#flick'));
  let edge = 'M300 0 L3200 0 L3200 3400 L300 3400'; for (let y = 3400; y >= 0; y -= 70) edge += ` L${(300 + rr(-30, 30)).toFixed(0)} ${y}`;
  w.innerHTML = svg('0 0 3200 3400', `<path d="${edge}Z" fill="${color}"/><path d="M420 0 L3200 0 L3200 3400 L420 3400Z" fill="#000" opacity=".06"/>`);
  gsap.set(w, { x: SW + 200, y: -800, rotation: 8, transformOrigin: '0 0' });
  tl.set(w, { visibility: 'visible' }, at - .45);
  tl.to(w, { x: -3400, duration: .9, ease: 'power2.inOut' }, at - .45);
  tl.set(w, { visibility: 'hidden' }, at + .46);
  sfx('rustle', at - .4, .8);
}
let at = 0, prev = null;
cut.forEach(([id, d, lid], n) => {
  const L = el('layer', {}, '', world);
  seed = 1000 + n * 97;
  show(L, at, d);
  if (SC[id]) SC[id](L, at, d, lid);
  const g = GROUP(id);
  if (n && g !== prev) doWipe(at, { spy: '#2a3160', parents: '#e0614b', borrow: '#58b07e', cta: '#5b5bd6' }[g]);
  if (id === 'flash') {   // mundur 3 jam: halaman kertas dibalik cepat
    doWipe(at, '#f6eedd'); sfx('flip', at - .4, .8);
  }
  prev = g;
  // judul besar (duh, 3 hours earlier, back)
  const HD = S.headline[id];
  if (HD && !id.startsWith('cta')) {
    const big = id === 'duh';
    const HL = el('layer', { width: SW, height: SH }, '', $('#hud'));
    show(HL, at, d);
    const T = tiles(HL, HD[0], V ? { x: 40, y: big ? 330 : 240, size: big ? 150 : 84, w: 1000 } : { x: big ? 90 : 0, y: big ? 330 : 64, size: big ? 170 : 92, w: big ? 1060 : 1920 });
    tilesIn(T.out, at + (big ? Math.min(.9, d * .25) : .25), big ? .1 : .05, !big);
    if (big) sfx('stamp', at + Math.min(.9, d * .25) + .55, .5);
  }
  // teks voiceover
  if (lid) {
    const ln = S.lines[lid];
    const c = el('', {}, ln.en, capBox);
    const len = Math.min(d - .4, words(ln.en));
    tl.fromTo(c, { opacity: 0, y: 14, rotation: rr(-1.5, 1.5) }, { opacity: 1, y: 0, duration: .2, immediateRender: false }, at + .3);
    tl.to(c, { opacity: 0, duration: .15 }, Math.min(at + d - .2, at + .3 + len + .5));
    AUDIO.push({ line: lid, at: +(at + .3).toFixed(2), max: +(d - .4).toFixed(2) });
  }
  if ((S.silence || []).includes(id)) SILENCE.push([at, at + d]);
  at += d;
});
const DUR = at;
if (V) {   // versi tegak: label merek kecil di bawah
  const f = el('pcs', { left: 340, top: 1760, width: 400, height: 64, background: '#fbf7ee', borderRadius: '32px', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '12px', font: '900 26px var(--ui)', color: 'var(--ink)' },
    `<img src="logo.png" style="width:38px;height:38px;border-radius:10px" alt="">Amnesia for macOS`, $('#hud'));
  gsap.set(f, { rotation: -1.5 });
}

// ---------- stop motion: timeline halus "dipatah" jadi 12 gambar/detik + getar kecil tiap gambar ----------
const pieces = [...document.querySelectorAll('.pc,.pcs')];
const flick = $('#flick');
let lastF = -1;
function step(time) {
  const f = Math.max(0, Math.min(Math.floor(time * STEP + 1e-4), Math.ceil(DUR * STEP) - 1));
  if (f === lastF) return; lastF = f;
  tl.seek(f / STEP, false);
  for (let i = 0; i < pieces.length; i++) {   // setiap potongan bergeser sedikit, seperti disentuh tangan animator
    const a = hash(f, i * 3 + 1), b = hash(f, i * 3 + 2), c = hash(f, i * 3 + 3);
    pieces[i].style.translate = `${((a - .5) * 1.6).toFixed(2)}px ${((b - .5) * 1.6).toFixed(2)}px`;
    pieces[i].style.rotate = `${((c - .5) * .5).toFixed(3)}deg`;
  }
  flick.style.opacity = (hash(f, 99991) * .035).toFixed(3);   // cahaya sedikit berkedip antar gambar
  cam.style.translate = `${((hash(f, 7) - .5) * 1.2).toFixed(2)}px ${((hash(f, 8) - .5) * 1.2).toFixed(2)}px`;
}
const master = gsap.timeline({ paused: true });
const proxy = { t: 0 };
master.to(proxy, { t: DUR, duration: DUR, ease: 'none', onUpdate: () => step(proxy.t) });
step(0);
window.STEP_TO = step;   // dipakai render.js
window.TL = master; window.DURATION = DUR; window.AUDIO = AUDIO; window.SFXQ = SFXQ; window.SILENCE = SILENCE;
window.SCENES = cut.map(([id, d, lid], i) => ({ id, line: lid, start: cut.slice(0, i).reduce((s, c) => s + c[1], 0), dur: d }));
if (Q.has('t')) { master.seek(+Q.get('t')); step(+Q.get('t')); }
if (Q.has('play')) master.play(0);
if (HF) window.__timelines[HF.id] = master;
window.READY = true;
})();
</script>
